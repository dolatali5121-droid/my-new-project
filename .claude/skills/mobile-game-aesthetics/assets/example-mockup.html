<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Angry-Birds-style Start Screen Mockup</title>
<style>
  :root {
    --sky-top: #7EC8E3;
    --sky-bottom: #C9EFFA;
    --grass-hi: #8BC34A;
    --grass-shadow: #5D9C2E;
    --wood: #8B5A2B;
    --wood-shadow: #5C3A1A;
    --outline: #2B2118;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #111;
  }

  .screen {
    width: 390px;
    height: 700px;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom) 70%);
    box-shadow: 0 0 0 6px #000, 0 20px 40px rgba(0,0,0,.5);
  }

  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: .9;
    box-shadow: 40px 8px 0 -6px #fff, -36px 10px 0 -10px #fff;
  }
  .cloud.c1 { width: 70px; height: 40px; top: 60px; left: 30px; }
  .cloud.c2 { width: 50px; height: 30px; top: 120px; left: 240px; }

  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 140px;
    background: var(--grass-hi);
    border-top: 6px solid var(--outline);
  }
  .ground::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 22px;
    background: var(--grass-shadow);
    clip-path: polygon(0 100%, 0 30%, 10% 0, 25% 40%, 40% 5%, 55% 45%, 70% 0, 85% 35%, 100% 10%, 100% 100%);
  }

  .title-banner {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    animation: pop-in .5s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: .1s;
    background: linear-gradient(to bottom, #F0553F, #C22E1D);
    border: 5px solid var(--outline);
    border-radius: 20px;
    padding: 14px 28px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 8px 0 #7A1D10, 0 10px 16px rgba(0,0,0,.3);
  }
  .title-banner h1 {
    margin: 0;
    color: #fff;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 var(--outline), 0 3px 0 var(--outline);
    -webkit-text-stroke: 2px var(--outline);
  }

  .play-btn {
    position: absolute;
    top: 320px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    font-weight: 800;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
    padding: 20px 56px;
    border: 4px solid var(--outline);
    border-radius: 999px;
    background: linear-gradient(to bottom, #8BDB4A, #5FA82E);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 8px 0 #3D5A1E, 0 10px 14px rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform .08s ease-out, box-shadow .08s ease-out;
  }
  .play-btn:active {
    transform: translateX(-50%) translateY(6px);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 2px 0 #3D5A1E, 0 4px 6px rgba(0,0,0,.2);
  }

  .level-node {
    position: absolute;
    top: 430px;
    left: 50%;
    transform: translateX(-50%);
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 4px solid var(--outline);
    background: radial-gradient(circle at 35% 30%, #FFE9A8, #F7C94C 70%);
    box-shadow: 0 6px 0 #8A5E08, 0 8px 12px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 24px;
    color: var(--outline);
  }

  .hud-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(to bottom, #FFE9A8, #F7C94C);
    border: 3px solid var(--outline);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 800;
    color: var(--outline);
    box-shadow: 0 4px 0 #8A5E08;
  }

  @keyframes pop-in {
    0%   { transform: translateX(-50%) scale(0); opacity: 0; }
    70%  { transform: translateX(-50%) scale(1.15); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="hud-badge">⭐ 2,450</div>

    <div class="title-banner"><h1>SLING SMASH</h1></div>

    <button class="play-btn">PLAY</button>

    <div class="level-node">3</div>

    <div class="ground"></div>
  </div>
</body>
</html>
