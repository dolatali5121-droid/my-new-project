<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalorieSnap — Photo Calorie Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>CalorieSnap</h1>
      <p class="tagline">Snap a photo, log your meal, track your day.</p>
    </header>

    <section class="card goal-card">
      <div class="goal-row">
        <label for="goal-input">Daily goal (kcal)</label>
        <div class="goal-controls">
          <input id="goal-input" type="number" min="0" step="50" />
          <button id="goal-save" class="btn btn-secondary">Save</button>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-label">
          <span id="consumed-total">0</span> / <span id="goal-total">0</span> kcal today
          (<span id="remaining-total">0</span> remaining)
        </div>
      </div>
    </section>

    <section class="card upload-card">
      <h2>Add a meal</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="photo">📷 From Photo</button>
        <button class="tab-btn" data-tab="manual">✏️ Manual Entry</button>
      </div>

      <div id="tab-photo" class="tab-panel active">
        <input id="file-input" type="file" accept="image/*" capture="environment" hidden />
        <div id="drop-zone" class="drop-zone">
          <img id="preview-img" class="preview-img" hidden alt="Selected meal preview" />
          <div id="drop-zone-text">
            <strong>Tap to choose or take a photo</strong>
            <span>JPG or PNG, up to 8MB</span>
          </div>
        </div>
        <button id="analyze-btn" class="btn btn-primary" disabled>Analyze Photo</button>
        <p id="analyze-status" class="status-text" aria-live="polite"></p>

        <div id="results" class="results" hidden>
          <h3>Detected items</h3>
          <div id="results-notes" class="results-notes"></div>
          <ul id="results-list" class="results-list"></ul>
          <div class="results-total">Total: <span id="results-total">0</span> kcal</div>
          <button id="add-log-btn" class="btn btn-primary">Add to Today's Log</button>
        </div>
      </div>

      <div id="tab-manual" class="tab-panel">
        <form id="manual-form" class="manual-form">
          <label>
            Food name
            <input id="manual-name" type="text" placeholder="e.g. Grilled chicken salad" required />
          </label>
          <label>
            Quantity / portion
            <input id="manual-quantity" type="text" placeholder="e.g. 1 bowl" />
          </label>
          <label>
            Calories (kcal)
            <input id="manual-calories" type="number" min="0" step="1" required />
          </label>
          <button type="submit" class="btn btn-primary">Add to Today's Log</button>
        </form>
      </div>
    </section>

    <section class="card log-card">
      <div class="log-header">
        <h2>Log for <span id="log-date-label"></span></h2>
        <input id="date-picker" type="date" />
      </div>
      <ul id="log-list" class="log-list"></ul>
      <p id="log-empty" class="empty-text">No meals logged for this day yet.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
